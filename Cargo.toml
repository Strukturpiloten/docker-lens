[package]
name = "docker-lens"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MPL-2.0"
description = "Bounded native Docker Engine observation and inert target planning contracts"
repository = "https://github.com/Strukturpiloten/docker-lens"
readme = "README.md"
publish = ["crates-io"]
include = ["Cargo.toml", "Cargo.lock", "LICENSE", "README.md", "src/**", "docs/**"]

[dependencies]
serde_json = "=1.0.154"
socket2 = "=0.6.5"

[dev-dependencies]
libc = "=0.2.189"
rustix = { version = "=1.1.5", features = ["net", "time"] }
sha2 = { version = "=0.11.1", default-features = false }
serde = "=1.0.229"
