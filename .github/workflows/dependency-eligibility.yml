---
name: Dependency eligibility

on: # zizmor: ignore[dangerous-triggers] -- Trusted listener delegates only immutable shared code; it never executes candidate code.
  schedule:
    - cron: "37 * * * *"
  workflow_run:
    workflows: [Check]
    types: [requested, completed]

permissions:
  contents: read
  actions: write
  pull-requests: read
  statuses: write

concurrency:
  group: dependency-eligibility
  cancel-in-progress: false

jobs:
  eligibility:
    permissions:
      actions: write
      checks: read
      contents: read
      pull-requests: write
      statuses: write
    name: Trusted dependency metadata
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' &&
      (github.event.workflow_run.event == 'pull_request' ||
      github.event.workflow_run.event == 'merge_group'))
    uses: Strukturpiloten/boxferry/.github/workflows/shared-dependency-eligibility.yml@5b4deb3fa2e06a0eea1643bbbdecec34e18b1281 # automation-v1 interface v1
    with:
      automation-sha: 5b4deb3fa2e06a0eea1643bbbdecec34e18b1281
