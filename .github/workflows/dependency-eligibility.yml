---
name: Dependency eligibility

on: # zizmor: ignore[dangerous-triggers] -- Trusted listener delegates only immutable shared code; it never executes candidate code.
  schedule:
    - cron: "37 * * * *"
  workflow_run:
    workflows: [Check]
    types: [requested, completed]

permissions:
  contents: read
  actions: write
  pull-requests: read
  statuses: write

concurrency:
  group: dependency-eligibility
  cancel-in-progress: false

jobs:
  eligibility:
    name: Trusted dependency metadata
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' &&
      (github.event.workflow_run.event == 'pull_request' ||
      github.event.workflow_run.event == 'merge_group'))
    uses: Strukturpiloten/boxferry/.github/workflows/shared-dependency-eligibility.yml@322024da130587ba14ea9f7eb499e5f41a07e43d # automation-v1 interface v1
    with:
      automation-sha: 322024da130587ba14ea9f7eb499e5f41a07e43d
