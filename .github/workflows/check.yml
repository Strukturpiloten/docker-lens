---
name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scaffold:
    name: Complete offline gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate scaffold
        run: ./scripts/check-all.sh --check

  native-conformance:
    name: Native Engine ${{ matrix.lane }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        lane: [debian11-rootful, debian11-rootless, upstream-rootful, upstream-rootless]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run isolated native lane
        env:
          DOCKERLENS_NATIVE_EVIDENCE_DIR: ${{ runner.temp }}/dockerlens-native-evidence
          DOCKERLENS_NATIVE_CANDIDATE_SHA: ${{ github.sha }}
        run: ./scripts/native-conformance.sh "${{ matrix.lane }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dockerlens-native-${{ matrix.lane }}
          path: ${{ runner.temp }}/dockerlens-native-evidence/${{ matrix.lane }}.json
          if-no-files-found: error
          retention-days: 30

  check-gate:
    name: Complete gate (PR offline, main native)
    if: always()
    needs: [scaffold, native-conformance]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail on skipped, cancelled, or failed validation
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          SCAFFOLD_RESULT: ${{ needs.scaffold.result }}
          NATIVE_RESULT: ${{ needs.native-conformance.result }}
        run: |
          test "$SCAFFOLD_RESULT" = success
          if [[ "$EVENT_NAME" == pull_request ]]; then
            test "$NATIVE_RESULT" = skipped
            echo 'PR validation is offline-only; native Engine evidence is not claimed'
          elif [[ "$EVENT_NAME" == push && "$EVENT_REF" == refs/heads/main ]]; then
            test "$NATIVE_RESULT" = success
          else
            echo 'unexpected validation event; native evidence is required' >&2
            exit 1
          fi
