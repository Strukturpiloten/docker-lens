---
name: Reviewed native validation

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open same-repository PR number reviewed for native execution (draft is allowed)
        required: true
        type: string
      expected_sha:
        description: Full lowercase SHA of that PR's current reviewed head
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dockerlens-native-validation-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  admission:
    name: Validate dispatcher and exact reviewed PR head
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Require current PR and both actors to be trusted
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/native-dispatch-admission.py

  candidate:
    name: Complete offline gate at exact PR head
    needs: admission
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact candidate
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Complete offline gate
        run: ./scripts/check-all.sh --check

  native-conformance:
    name: Native Engine ${{ matrix.lane }}
    needs: candidate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        lane: [debian11-rootful, debian11-rootless, upstream-rootful, upstream-rootless]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Recheck actors and exact PR head before native lane
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/native-dispatch-admission.py
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact native candidate
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Run isolated native lane
        run: ./scripts/native-conformance.sh "${{ matrix.lane }}"

  native-gate:
    name: All reviewed native validation required
    if: always()
    needs: [admission, candidate, native-conformance]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject failed, skipped, or cancelled lanes
        env:
          ADMISSION_RESULT: ${{ needs.admission.result }}
          CANDIDATE_RESULT: ${{ needs.candidate.result }}
          NATIVE_RESULT: ${{ needs.native-conformance.result }}
        run: |
          test "$ADMISSION_RESULT" = success
          test "$CANDIDATE_RESULT" = success
          test "$NATIVE_RESULT" = success
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Recheck current reviewed PR head and both actors
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/native-dispatch-admission.py
