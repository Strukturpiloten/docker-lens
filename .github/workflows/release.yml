---
name: Release DockerLens
run-name: Release DockerLens ${{ inputs.expected_version }} at ${{ inputs.expected_sha }}

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full SHA of the exact current main candidate
        required: true
        type: string
      expected_version:
        description: Reviewed stable version in Cargo.toml and CHANGELOG.md
        required: true
        type: string
      validation_only:
        description: Validate the candidate without requesting publication approval
        default: true
        required: true
        type: boolean

permissions: {}

concurrency:
  group: docker-lens-release
  cancel-in-progress: false

jobs:
  admission:
    name: Admit only the first exact protected-main dispatch
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require the exact protected main before validation
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = Strukturpiloten/docker-lens
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = 1
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          gh api "repos/${GITHUB_REPOSITORY}/branches/main" |
            jq -se --arg sha "$EXPECTED_SHA" '
              select(length == 1) | .[0] |
              .name == "main" and .protected == true and .commit.sha == $sha
            ' > /dev/null

  validation:
    name: Complete exact-main release validation
    needs: admission
    permissions:
      contents: read
    uses: ./.github/workflows/release-validation.yml
    with:
      expected_sha: ${{ inputs.expected_sha }}

  inventory:
    name: Prepare exact version and notes without publication
    needs: validation
    if: needs.validation.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.inventory.outputs.version }}
      notes_sha256: ${{ steps.identity.outputs.notes_sha256 }}
      approval_comment: ${{ steps.identity.outputs.approval_comment }}
      environment_id: ${{ steps.protection.outputs.environment_id }}
    steps:
      - name: Check out the validated candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          path: source
          persist-credentials: false
      - name: Record exact candidate, version and notes for review
        id: identity
        working-directory: source
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          VALIDATED_SHA: ${{ needs.validation.outputs.candidate_sha }}
          VALIDATION_ONLY: ${{ inputs.validation_only }}
        run: python3 scripts/release-candidate.py
      - name: Check out immutable shared automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Strukturpiloten/boxferry
          # renovate: datasource=github-digest depName=Strukturpiloten/boxferry currentValue=automation-v1
          ref: cf3578f47416e1b27b770fe4a81918844fb2d58b
          path: _automation
          persist-credentials: false
      - name: Install locked shared tooling
        uses: ./_automation/.github/actions/shared-python
      - name: Verify the candidate crate inventory without registry credentials
        id: inventory
        uses: ./_automation/.github/actions/shared-crate-publish
        with:
          candidate-sha: ${{ inputs.expected_sha }}
          automation-sha: cf3578f47416e1b27b770fe4a81918844fb2d58b
          release-config: ${{ github.workspace }}/source/scripts/release-policy.json
          package: docker-lens
          validation-sha: ${{ needs.validation.outputs.candidate_sha }}
          validation-result: ${{ needs.validation.result }}
          validation-only: "true"
      - name: Require the exact inventory version
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          INVENTORY_VERSION: ${{ steps.inventory.outputs.version }}
        run: test "${INVENTORY_VERSION}" = "${EXPECTED_VERSION}"
      - name: Verify release protection before requesting approval
        if: inputs.validation_only == false
        id: protection
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: bash source/scripts/release-approval.sh --preflight

  approval:
    name: Approve and publish docker-lens ${{ inputs.expected_version }}
    needs: [validation, inventory]
    if: >-
      github.repository == 'Strukturpiloten/docker-lens' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      inputs.validation_only == false &&
      needs.validation.result == 'success' &&
      needs.validation.outputs.candidate_sha == inputs.expected_sha &&
      needs.inventory.result == 'success' &&
      needs.inventory.outputs.version == inputs.expected_version &&
      needs.inventory.outputs.notes_sha256 != '' &&
      needs.inventory.outputs.approval_comment != '' &&
      needs.inventory.outputs.environment_id != ''
    environment: release
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      id-token: write # Used by the shared publisher after the approval and candidate checks.
    steps:
      - name: Check out the validated candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          path: source
          persist-credentials: false
      - name: Verify the release environment and the recorded approval
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          PREPARED_ENVIRONMENT_ID: ${{ needs.inventory.outputs.environment_id }}
          APPROVAL_COMMENT: ${{ needs.inventory.outputs.approval_comment }}
        run: bash source/scripts/release-approval.sh --review
      - name: Check out immutable shared automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Strukturpiloten/boxferry
          # renovate: datasource=github-digest depName=Strukturpiloten/boxferry currentValue=automation-v1
          ref: cf3578f47416e1b27b770fe4a81918844fb2d58b
          path: _automation
          persist-credentials: false
      - name: Install locked shared tooling
        uses: ./_automation/.github/actions/shared-python
      - name: Recheck main, crate version and approved notes
        working-directory: source
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          VALIDATED_SHA: ${{ needs.validation.outputs.candidate_sha }}
          PREPARED_VERSION: ${{ needs.inventory.outputs.version }}
          PREPARED_NOTES_SHA256: ${{ needs.inventory.outputs.notes_sha256 }}
        run: python3 scripts/release-candidate.py --after-approval
      - name: Publish the approved crate through shared trusted publishing
        uses: ./_automation/.github/actions/shared-crate-publish
        with:
          candidate-sha: ${{ inputs.expected_sha }}
          automation-sha: cf3578f47416e1b27b770fe4a81918844fb2d58b
          release-config: ${{ github.workspace }}/source/scripts/release-policy.json
          package: docker-lens
          validation-sha: ${{ needs.validation.outputs.candidate_sha }}
          validation-result: ${{ needs.validation.result }}
          validation-only: "false"
