---
name: Hosted zero-swap boot trial

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dockerlens-hosted-zero-swap-trial
  cancel-in-progress: false

jobs:
  hosted-zero-swap-trial:
    name: Boot and observe the hosted zero-swap fixture
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run bounded disposable VM trial
        id: trial
        run: exec python3 -B scripts/hosted-zero-swap-trial.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && steps.trial.outputs.receipt_path != '' }}
        with:
          name: dockerlens-hosted-zero-swap-trial
          path: ${{ steps.trial.outputs.receipt_path }}
          if-no-files-found: error
          retention-days: 7
