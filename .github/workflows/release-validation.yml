---
name: Release validation

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full commit SHA of the exact main candidate
        required: true
        type: string

permissions:
  contents: read

jobs:
  candidate:
    name: Exact candidate and complete scaffold gate
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    outputs:
      candidate_sha: ${{ inputs.expected_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact current main candidate
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "${GITHUB_SHA}" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA"
      - name: Set up exact shared CI Node
        uses: ./.github/actions/setup-node
      - name: Complete scaffold gate
        run: ./scripts/check-all.sh --check

  native-conformance:
    name: Native Engine ${{ matrix.lane }}
    needs: candidate
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    outputs:
      candidate_sha: ${{ inputs.expected_sha }}
    strategy:
      fail-fast: false
      matrix:
        lane:
          [
            debian11-rootful,
            debian11-rootless,
            upstream-rootful,
            upstream-rootless,
          ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify native lane uses current candidate
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA"
      - name: Native conformance gate
        env:
          DOCKERLENS_NATIVE_EVIDENCE_DIR: ${{ runner.temp }}/dockerlens-native-evidence
          DOCKERLENS_NATIVE_CANDIDATE_SHA: ${{ inputs.expected_sha }}
        run: ./scripts/native-conformance.sh "${{ matrix.lane }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dockerlens-native-${{ matrix.lane }}
          path: ${{ runner.temp }}/dockerlens-native-evidence/${{ matrix.lane }}.json
          if-no-files-found: error
          retention-days: 30

  dependencies:
    needs: candidate
    uses: Strukturpiloten/boxferry/.github/workflows/shared-rust-dependencies.yml@7b9ce867e0de8b05ee5d084581cad7de54d06459 # automation-v1 interface v1
    with:
      candidate_sha: ${{ inputs.expected_sha }}
      automation_sha: 7b9ce867e0de8b05ee5d084581cad7de54d06459
      policy_sha: ${{ inputs.expected_sha }}
      config_path: scripts/validation-policy.json

  api:
    needs: candidate
    uses: Strukturpiloten/boxferry/.github/workflows/shared-rust-semver.yml@7b9ce867e0de8b05ee5d084581cad7de54d06459 # automation-v1 interface v1
    with:
      candidate_sha: ${{ inputs.expected_sha }}
      automation_sha: 7b9ce867e0de8b05ee5d084581cad7de54d06459
      policy_sha: ${{ inputs.expected_sha }}
      config_path: scripts/validation-policy.json
      package: docker-lens
      api_purpose: published
      release_type: ""
      initial_api_contract: false

  shared-release-gate:
    name: Shared exact-candidate release policy
    if: always()
    needs: [candidate, native-conformance, dependencies, api]
    uses: Strukturpiloten/boxferry/.github/workflows/shared-release-validation.yml@7b9ce867e0de8b05ee5d084581cad7de54d06459 # automation-v1 interface v1
    with:
      candidate_sha: ${{ inputs.expected_sha }}
      automation_sha: 7b9ce867e0de8b05ee5d084581cad7de54d06459
      policy_sha: ${{ inputs.expected_sha }}
      config_path: scripts/release-policy.json
      needs_json: ${{ toJSON(needs) }}

  release-gate:
    name: All exact-candidate validation required
    if: always()
    needs:
      [candidate, native-conformance, dependencies, api, shared-release-gate]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Fail on skipped, cancelled, or failed validation
        env:
          CANDIDATE_RESULT: ${{ needs.candidate.result }}
          NATIVE_RESULT: ${{ needs.native-conformance.result }}
          DEPENDENCIES_RESULT: ${{ needs.dependencies.result }}
          API_RESULT: ${{ needs.api.result }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          PUBLISHED_API_CANDIDATE_SHA: ${{ needs.api.outputs.published_api_candidate_sha }}
          SHARED_RESULT: ${{ needs.shared-release-gate.result }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$PUBLISHED_API_CANDIDATE_SHA" = "$EXPECTED_SHA"
          test "$CANDIDATE_RESULT" = success
          test "$NATIVE_RESULT" = success
          test "$DEPENDENCIES_RESULT" = success
          test "$API_RESULT" = success
          test "$SHARED_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck current main after all lanes
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA"
