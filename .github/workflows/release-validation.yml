---
name: Release validation

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full commit SHA of the exact main candidate
        required: true
        type: string

permissions:
  contents: read

jobs:
  candidate:
    name: Exact candidate and complete scaffold gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact current main candidate
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA"
      - name: Complete scaffold gate
        run: ./scripts/check-all.sh --check

  native-conformance:
    name: Native Engine ${{ matrix.lane }}
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        lane: [debian11-rootful, debian11-rootless, upstream-rootful, upstream-rootless]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify native lane uses current candidate
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA"
      - name: Native conformance gate
        run: ./scripts/native-conformance.sh "${{ matrix.lane }}"

  release-gate:
    name: All exact-candidate validation required
    if: always()
    needs: [candidate, native-conformance]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail on skipped, cancelled, or failed validation
        env:
          CANDIDATE_RESULT: ${{ needs.candidate.result }}
          NATIVE_RESULT: ${{ needs.native-conformance.result }}
        run: |
          test "$CANDIDATE_RESULT" = success
          test "$NATIVE_RESULT" = success
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck current main after all lanes
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA"
